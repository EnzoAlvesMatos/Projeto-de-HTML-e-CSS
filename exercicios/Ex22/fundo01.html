<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        background-image: url("img/wallpaper004.jpg");
      }
      div.quadrado {
        display: inline-block;
        border: 2px solid black;
        border-radius: 10px;
        background-color: lightgray;
        width: 300px;
        height: 300px;
      }
      div.circulo {
        display: inline-block;
        border: 2px double black;
        background-color: gray;
        border-radius: 50%;
        width: 300px;
        height: 300px;
      }
      div#q1 {
        background-color: rgb(6, 211, 6);
      }
      div#q2 {
        background-image: linear-gradient(to bottom, yellow, orange);
      }
      div#q3 {
        background-image: url("img/pattern003.png");
      }
      div#c1 {
        background-color: rgb(88, 88, 192);
      }
      div#c2 {
        background-image: linear-gradient(to top, green, rgb(5, 243, 5));
      }
      div#c3 {
        background-image: url("img/pattern001.png");
      }
    </style>
  </head>
  <body>
    <div class="quadrado" id="q1"></div>
    <div class="quadrado" id="q2"></div>
    <div class="quadrado" id="q3"></div>
    <div class="circulo" id="c1"></div>
    <div class="circulo" id="c2"></div>
    <div class="circulo" id="c3"></div>
  </body>
</html>
