<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tabela</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
      }
      table {
        border: 2px solid black;
        border-collapse: collapse;
        width: 300px;
        text-align: center;
      }
      td {
        border: 2px solid black;
        padding: 10px;
      }
      tr:nth-child(2n) {
        background-color: orangered;
      }
      tr {
        background-color: rgba(255, 68, 0, 0.87);
      }
    </style>
  </head>
  <body>
    <h1>mesclagem de Celulas</h1>
    <table>
      <tr>
        <td>A</td>
        <td colspan="2">B</td>
      </tr>
      <tr>
        <td>D</td>
        <td rowspan="3">E</td>
        <td rowspan="3">F</td>
      </tr>
      <tr>
        <td>H</td>
      </tr>
      <tr>
        <td>M</td>
      </tr>
    </table>
  </body>
</html>
