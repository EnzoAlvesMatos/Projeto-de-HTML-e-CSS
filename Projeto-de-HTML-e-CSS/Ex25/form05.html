<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulário</title>
  </head>
  <body>
    <form action="" method="get" autocomplete="on">
      <h1>Exemplo de Formulário</h1>
      <fieldset>
        <legend>Sexo</legend>
        <input type="radio" name="sexo" id="imasc" value="Masculino" checked />
        <label for="imasc">Masculino</label>
        <input type="radio" name="sexo" id="ifemi" value="Feminino" />
        <label for="ifemi">Feminino</label>
      </fieldset>
      <fieldset>
        <legend>Esportes favoritos</legend>
        <input type="checkbox" name="Jiujit" id="ijiujit" checked />
        <label for="ijiujit">Jiu-jitsu</label>
        <input type="checkbox" name="cap" id="icap" />
        <label for="icap">Capoeira</label>
        <input type="checkbox" name="fut" id="ifut" />
        <label for="ifut">Futebol</label>
        <input type="checkbox" name="basq" id="ibasq" />
        <label for="ibasq">Basquete</label>
      </fieldset>

      <p>
        <input type="submit" value="Enviar" />

        <input type="reset" value="Limpar" />
      </p>
    </form>
  </body>
</html>
