<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estudos de Iframe</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
      }
      iframe {
        height: 400px;
        width: 400px;
        border: 2px dotted black;
      }
    </style>
  </head>
  <body>
    <h1>Testando o uso de um Iframe</h1>
    <p>
      Acessando o site do
      <!--Tamanho pdarão de um iframe é de 300x150-->
      <iframe
        src="https://www.cursoemvideo.com"
        frameborder="0"
        scolling="auto"
      >
        no <a href="https://www.cursoemvideo.com">site do curso em video</a>
      </iframe>
      para aprender a programar
    </p>
    <p>
      O repositório do Guanabara
      <iframe src="https://gustavoguanabara.github.io" frameborder="0">
        no
        <a target="_blank" href="https://gustavoguanabara.github.io"
          >Link do repositório do Gustavo Guanabara</a
        >
      </iframe>

      também é bem legal
    </p>
  </body>
</html>
