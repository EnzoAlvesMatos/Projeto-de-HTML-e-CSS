<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>inserindo videos localmente</h1>
    <p>gerando video localmente</p>
    <video src="midia/video.mp4" width="200px" controls></video>
    <!--uma das formas-->
    <video width="200" poster="img/tab.jpg" controls>
      <source src="midia/video.mp4" type="video/mp4" />
      <p>seu video não é compativel</p>
    </video>
    <h1>inserindo videos do youtube</h1>
    <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/ogcYo54WG9U?si=DAa7eyehHq3m3QWo"
      title="YouTube video player"
      frameborder="0"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>
  </body>
</html>
