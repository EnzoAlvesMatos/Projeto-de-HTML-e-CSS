<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
      }
      table {
        border: 2px solid black;
        border-collapse: collapse;
      }
      caption {
        border-top: 2px solid black;
        border-left: 2px solid black;
        border-right: 2px solid black;
        font-weight: bold;
        font-size: 1.5em;
        background-color: gray;
      }
      th,
      td {
        border: 2px solid black;
        padding: 10px;
      }
      th {
        color: white;
        background-color: gray;
        font-size: 1.2em;
      }
      col.cnome {
        background-color: rgba(5, 216, 5, 0.705);
      }
    </style>
  </head>
  <body>
    <h1>Exercicio de tabelas</h1>
    <table>
      <colgroup>
        <col class="cnome" />
        <col class="csexo" />
        <col class="cidade" />
        <col class="cprofissao" />
      </colgroup>
      <caption>
        Cadastro
      </caption>
      <tr>
        <th scope="col">Nome</th>
        <th scope="col">Sexo</th>
        <th scope="col">Idade</th>
        <th scope="col">Profissão</th>
      </tr>
      <tr>
        <td>Ana</td>
        <td>F</td>
        <td>20</td>
        <td>Escritora</td>
      </tr>
      <tr>
        <td>Maria</td>
        <td>F</td>
        <td>29</td>
        <td>Professora</td>
      </tr>
      <tr>
        <td>Pedro</td>
        <td>M</td>
        <td>40</td>
        <td>Pedreiro</td>
      </tr>
      <tr>
        <td>Adevaldo</td>
        <td>M</td>
        <td>54</td>
        <td>Pintor</td>
      </tr>
      <tr>
        <td>Enzo</td>
        <td>M</td>
        <td>19</td>
        <td>Tecnico de TI</td>
      </tr>
      <tr>
        <td>João</td>
        <td>M</td>
        <td>40</td>
        <td>Artista</td>
      </tr>
    </table>
  </body>
</html>
