<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            width: 400px;
            height: 400px;
            border-collapse: collapse;
            font-weight: bold;
        }
        tr.linha{
            background-color: black;
            color: white;
        }
    
        td{
             border: 2px solid black;
             padding: 8px;
             text-align: center; /*Alinhamento Horizontal*/
             vertical-align: middle; /*Alinhamento vertical*/

        }
    </style>
</head>
<body>
    <h1>Minha Primeira tabela</h1>
    <!--
   HIERARQUIA DE TABLES (simples)
   TABLE = tabela
   TABLE ROW = linha de tabela
   TABLE HEADER = cabeçalho de tabela
   TABLE DATA = dado de tabela
    -->
    <table>
     <tr><!--Primeira linha-->
       <td>A1</td>
       <td>B1</td>
       <td>C1</td>
       <tr> <!--Segunda linha-->
        <td>A2</td>
        <td>B2</td>
        <td>C2</td>
       </tr>
       <tr><!--Terceira linha-->
        <td>A3</td>
        <td>B3</td>
        <td>C3</td>
       </tr>
       <tr><!--Quarta linha-->
         <td>A4</td>
         <td>B4</td>
         <td>C4</td>
       </tr>
     </tr>
    </table>
</body>
</html>
