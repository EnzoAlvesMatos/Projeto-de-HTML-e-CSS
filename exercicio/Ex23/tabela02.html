<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabelas</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
      }

      table {
        border: 2px solid black;
        border-collapse: collapse;
        width: 500px;
        position: relative;
      }
      caption {
        border-top: 2px solid black;
        border-left: 2px solid black;
        border-right: 2px solid black;
        background-color: rgba(0, 119, 255, 0.836);
        padding: 10px;
        font-weight: bold;
        font-size: 1.6em;
      }
      thead,
      tfoot {
        background-color: rgb(0, 0, 255);
        padding: 10px;
        color: white;
      }
      thead > tr > th {
        position: sticky;
        top: -1px;
        background-color: rgb(0, 0, 255);
      }
      tbody > tr:nth-child(2n) {
        background-color: rgba(0, 119, 255, 0.836);
      }
      td,
      th {
        border: 2px solid black;
        text-align: center;
        padding: 10px;
      }
      th {
        font-weight: bold;
        font-size: 1.2em;
      }
      .num {
        text-align: right;
      }
    </style>
  </head>
  <body>
    <h1>Uso de tabelas grandes</h1>
    <!--
    ANATOMIA PARA TABELAS GRANDES
     TABLE
       THEAD
        TR,TD,TH
       TBODY
        TR,TD,TH
       TFOOT
        TR,TD,TH 
    -->
    <table>
      <caption>
        Personagens de Dragon Ball
      </caption>
      <thead>
        <tr>
          <th scope="col">Personagens</th>
          <th scope="col">Número</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Goku</td>
          <td class="num">1</td>
        </tr>
        <tr>
          <td>Kuririn</td>
          <td class="num">2</td>
        </tr>
        <tr>
          <td>Trunks</td>
          <td class="num">3</td>
        </tr>
        <tr>
          <td>Yajirobe</td>
          <td class="num">4</td>
        </tr>
        <tr>
          <td>Piccolo</td>
          <td class="num">5</td>
        </tr>
        <tr>
          <td>Tenshihan</td>
          <td class="num">6</td>
        </tr>
        <tr>
          <td>Son Goten</td>
          <td class="num">7</td>
        </tr>
        <tr>
          <td>Son Gohan</td>
          <td class="num">8</td>
        </tr>
        <tr>
          <td>Chaos</td>
          <td class="num">9</td>
        </tr>
        <tr>
          <td>Vegeta</td>
          <td class="num">10</td>
        </tr>
        <tr>
          <td>Bulma</td>
          <td class="num">11</td>
        </tr>
        <tr>
          <td>Android 18</td>
          <td class="num">12</td>
        </tr>
        <tr>
          <td>Android 17</td>
          <td class="num">13</td>
        </tr>
        <tr>
          <td>Mestrw Kame</td>
          <td class="num">14</td>
        </tr>
        <tr>
          <td>Chi Chi</td>
          <td class="num">15</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <th scope="row">Total de Personagens</th>
          <td class="num">15</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
