<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="" method="get" autocomplete="on">
   <fieldset>
    <legend>dados pessoais</legend>
       <p>
           <label for="iemail">Email</label>
           <input type="email" name="email" id="iemail"  required autocomplete="email">
       </p>
       <p>
        <label for="itel">Telefone</label>
        <input type="tel" name="tel" id="itel" pattern="^\(\d{2}\)\d{4,5}-\d{4}$" required autocomplete="tel" placeholder="(xx)xxxxx-xxxx">
       </p>
   </fieldset>
   <!--Estudar mais sobre RegEx-->
   <p>
    <input type="submit" value="Enviar">
    <input type="reset" value="Limpar">
    
   </p>
   </form>
</html>
