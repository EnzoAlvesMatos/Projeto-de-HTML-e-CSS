<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
   <h1>Exemplo de Formulário</h1>
   <form method="post">
   <p>
   <input type="range" name="niv" id="iniv" max="200" oninput="ival.innerHTML = Number(iniv.value)">
   <output name="val" id="ival"></output>
   <p>
    <input type="submit" value="Enviar">
    <input type="reset" value="Limpar">
   </p>
   </p>
   </form>
</body>
</html>
